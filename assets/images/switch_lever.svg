<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic gradient for the handle -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#616161"/>
      <stop offset="50%" stop-color="#9e9e9e"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    <!-- Gradient for the shaft to give it a cylindrical look -->
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="50%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
  </defs>

  <!-- Shaft - now a bit wider and with a gradient -->
  <rect x="40" y="50" width="20" height="80" rx="5" fill="url(#shaftGrad)" stroke="#424242" stroke-width="1"/>

  <!-- Handle Grip - more rounded and metallic -->
  <rect x="30" y="10" width="40" height="40" rx="20" fill="url(#handleGrad)" stroke="#424242" stroke-width="2"/>
  <!-- A small connecting piece to the shaft -->
  <rect x="40" y="40" width="20" height="10" fill="url(#shaftGrad)" stroke="#424242" stroke-width="1"/>

  <!-- Pivot Point - slightly larger and more integrated -->
  <circle cx="50" cy="130" r="7" fill="#424242" stroke="#212121" stroke-width="1"/>
</svg>