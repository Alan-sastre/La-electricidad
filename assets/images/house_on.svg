<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallSiding" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E8D0;stop-opacity:1" />
    </linearGradient>
    <pattern id="sidingLines" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect width="20" height="10" fill="url(#wallSiding)" />
      <line x1="0" y1="10" x2="20" y2="10" stroke="#D3D3B0" stroke-width="1"/>
    </pattern>
    <linearGradient id="roofTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="winLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="houseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <g>
      <!-- Chimney -->
      <rect x="140" y="30" width="20" height="40" fill="#800000" stroke="#500000" stroke-width="1"/>
      <rect x="138" y="25" width="24" height="6" fill="#600000" />
      
      <!-- Main Body -->
      <rect x="30" y="80" width="140" height="100" fill="url(#sidingLines)" />
      
      <!-- Roof -->
      <path d="M100,10 L185,80 L15,80 Z" fill="url(#roofTile)" stroke="#3E2723" stroke-width="2" stroke-linejoin="round"/>
      
      <!-- Door -->
      <rect x="85" y="115" width="30" height="65" fill="#654321" />
      <rect x="88" y="118" width="24" height="62" fill="#8B4513" stroke="#5D4037" stroke-width="1"/>
      <circle cx="108" cy="150" r="2" fill="#FFD700" />

      <!-- Windows (Lit) -->
      <g filter="url(#houseGlow)">
        <!-- Left Window -->
        <g transform="translate(45, 100)">
          <rect x="0" y="0" width="30" height="30" fill="url(#winLight)" stroke="#DAA520" stroke-width="2"/>
          <line x1="15" y1="0" x2="15" y2="30" stroke="#DAA520" stroke-width="2"/>
          <line x1="0" y1="15" x2="30" y2="15" stroke="#DAA520" stroke-width="2"/>
        </g>
        
        <!-- Right Window -->
        <g transform="translate(125, 100)">
          <rect x="0" y="0" width="30" height="30" fill="url(#winLight)" stroke="#DAA520" stroke-width="2"/>
          <line x1="15" y1="0" x2="15" y2="30" stroke="#DAA520" stroke-width="2"/>
          <line x1="0" y1="15" x2="30" y2="15" stroke="#DAA520" stroke-width="2"/>
        </g>
      </g>
  </g>
</svg>