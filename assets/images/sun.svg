<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFE0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Glow/Halo -->
  <circle cx="100" cy="100" r="80" fill="url(#sunGrad)" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Inner Body -->
  <circle cx="100" cy="100" r="60" fill="url(#sunGrad)" />
  
  <!-- Subtle Rays (Not lines, but faint shapes) -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.5" filter="url(#glow)">
     <line x1="100" y1="20" x2="100" y2="180" stroke-dasharray="5,15" />
     <line x1="20" y1="100" x2="180" y2="100" stroke-dasharray="5,15" />
     <line x1="43" y1="43" x2="157" y2="157" stroke-dasharray="5,15" />
     <line x1="43" y1="157" x2="157" y2="43" stroke-dasharray="5,15" />
  </g>
  
  <!-- Bright center highlight -->
  <circle cx="100" cy="100" r="40" fill="#FFFACD" opacity="0.6" filter="url(#glow)"/>
</svg>