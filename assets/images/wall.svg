<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Subtle Pattern for Wall -->
    <pattern id="pegboard" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#e0e0e0"/> <!-- Light grey base -->
      <circle cx="20" cy="20" r="2" fill="#bdbdbd"/> <!-- Peg hole -->
    </pattern>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Base Wall -->
  <rect width="512" height="512" fill="url(#pegboard)"/>

  <!-- Vignette for depth -->
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- Subtle Stripe for Context (Workshop styling) -->
  <rect x="0" y="400" width="512" height="20" fill="#ff9800" opacity="0.8"/>
  <rect x="0" y="420" width="512" height="92" fill="#37474f"/> <!-- Dado rail / lower wall -->
</svg>