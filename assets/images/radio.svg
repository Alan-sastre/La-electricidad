<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <rect x="10" y="20" width="80" height="60" rx="5" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
  <!-- Speaker Mesh -->
  <circle cx="50" cy="50" r="20" fill="#BCAAA4" stroke="#8D6E63" stroke-width="1"/>
  <circle cx="50" cy="50" r="15" fill="none" stroke="#5D4037" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Dial -->
  <rect x="65" y="30" width="15" height="40" fill="#3E2723"/>
  <line x1="65" y1="40" x2="80" y2="40" stroke="#FF5722" stroke-width="2"/>
  <!-- Antenna -->
  <line x1="20" y1="20" x2="10" y2="5" stroke="#9E9E9E" stroke-width="3"/>
  <circle cx="10" cy="5" r="3" fill="#9E9E9E"/>
  <!-- Knobs -->
  <circle cx="20" cy="70" r="5" fill="#424242"/>
  <circle cx="80" cy="70" r="5" fill="#424242"/>
</svg>