<svg width="200" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cloudBody" cx="50%" cy="40%" r="50%" fx="50%" fy="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#softShadow)">
      <!-- Main body puffs -->
      <circle cx="50" cy="80" r="30" fill="url(#cloudBody)"/>
      <circle cx="90" cy="70" r="40" fill="url(#cloudBody)"/>
      <circle cx="140" cy="80" r="30" fill="url(#cloudBody)"/>
      <circle cx="70" cy="50" r="35" fill="url(#cloudBody)"/>
      <circle cx="120" cy="50" r="35" fill="url(#cloudBody)"/>
      
      <!-- Bottom flat-ish part to make it look like a cumulus base -->
      <rect x="50" y="80" width="90" height="20" rx="10" ry="10" fill="url(#cloudBody)"/>
  </g>
  
  <!-- Subtle Highlight on top -->
  <path d="M70,25 Q95,15 120,25" stroke="#FFF" stroke-width="2" fill="none" opacity="0.6"/>
</svg>