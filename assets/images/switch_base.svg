<svg width="150" height="200" viewBox="0 0 150 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <filter id="insetShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="rgb(0,0,0)" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode />
      </feMerge>
    </filter>
  </defs>

  <!-- Box -->
  <rect x="25" y="25" width="100" height="150" rx="5" fill="url(#boxGrad)" stroke="#2c3e50" stroke-width="2"/>

  <!-- Screws -->
  <circle cx="35" cy="35" r="5" fill="#bdc3c7" stroke="#7f8c8d"/>
  <line x1="32" y1="35" x2="38" y2="35" stroke="#7f8c8d"/>

  <circle cx="115" cy="35" r="5" fill="#bdc3c7" stroke="#7f8c8d"/>
  <line x1="112" y1="35" x2="118" y2="35" stroke="#7f8c8d"/>

  <circle cx="35" cy="165" r="5" fill="#bdc3c7" stroke="#7f8c8d"/>
  <line x1="32" y1="165" x2="38" y2="165" stroke="#7f8c8d"/>

  <circle cx="115" cy="165" r="5" fill="#bdc3c7" stroke="#7f8c8d"/>
  <line x1="112" y1="165" x2="118" y2="165" stroke="#7f8c8d"/>

  <!-- Slot -->
  <rect x="65" y="50" width="20" height="100" rx="10" fill="#2c3e50" filter="url(#insetShadow)"/>

  <!-- Terminals -->
  <circle cx="10" cy="100" r="8" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>
  <circle cx="140" cy="100" r="8" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>
</svg>