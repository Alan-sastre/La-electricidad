<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42a5f5"/> <!-- Blue tint -->
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eeeeee"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </radialGradient>
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>

  <g>
    <!-- Blade 1 (Top) -->
    <path d="M100 100 C110 80 140 20 120 10 C100 0 80 40 100 100" fill="url(#bladeGrad)" stroke="#1565c0" stroke-width="1"/>
    
    <!-- Blade 2 (Right) -->
    <path d="M100 100 C120 110 180 140 190 120 C200 100 160 80 100 100" fill="url(#bladeGrad)" stroke="#1565c0" stroke-width="1"/>
    
    <!-- Blade 3 (Bottom) -->
    <path d="M100 100 C90 120 60 180 80 190 C100 200 120 160 100 100" fill="url(#bladeGrad)" stroke="#1565c0" stroke-width="1"/>
    
    <!-- Blade 4 (Left) -->
    <path d="M100 100 C80 90 20 60 10 80 C0 100 40 120 100 100" fill="url(#bladeGrad)" stroke="#1565c0" stroke-width="1"/>
    
    <!-- Hub -->
    <circle cx="100" cy="100" r="15" fill="url(#hubGrad)" stroke="#9e9e9e" stroke-width="2"/>
    <circle cx="100" cy="100" r="5" fill="#757575"/>
  </g>
</svg>