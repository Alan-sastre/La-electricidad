<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0E0E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4682B4;stop-opacity:1" />
    </linearGradient>
    <filter id="winShadow">
       <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
       <feOffset dx="1" dy="1"/>
       <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
       <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <g filter="url(#winShadow)">
    <!-- Outer Frame -->
    <rect x="2" y="2" width="56" height="56" fill="#8B4513" stroke="#5D4037" stroke-width="1"/>
    
    <!-- Glass Panes -->
    <rect x="6" y="6" width="22" height="22" fill="url(#glassBlue)" stroke="#2F4F4F" stroke-width="0.5"/>
    <rect x="32" y="6" width="22" height="22" fill="url(#glassBlue)" stroke="#2F4F4F" stroke-width="0.5"/>
    <rect x="6" y="32" width="22" height="22" fill="url(#glassBlue)" stroke="#2F4F4F" stroke-width="0.5"/>
    <rect x="32" y="32" width="22" height="22" fill="url(#glassBlue)" stroke="#2F4F4F" stroke-width="0.5"/>
    
    <!-- Inner Cross Frame -->
    <rect x="28" y="2" width="4" height="56" fill="#8B4513"/>
    <rect x="2" y="28" width="56" height="4" fill="#8B4513"/>
  </g>
  
  <!-- Diagonal Reflection -->
  <path d="M6,6 L28,6 L6,28 Z" fill="#FFF" opacity="0.3"/>
  <path d="M32,32 L54,32 L32,54 Z" fill="#FFF" opacity="0.3"/>
</svg>