<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="20%" stop-color="#4ca1af"/>
      <stop offset="50%" stop-color="#2c3e50"/>
      <stop offset="80%" stop-color="#1a252f"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    <!-- Top Terminal Gradient -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bdc3c7"/>
      <stop offset="50%" stop-color="#ecf0f1"/>
      <stop offset="100%" stop-color="#bdc3c7"/>
    </linearGradient>
    <!-- Highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Top Terminal -->
    <rect x="70" y="10" width="60" height="40" rx="5" fill="url(#topGrad)" stroke="#7f8c8d" stroke-width="1"/>

    <!-- Main Body -->
    <rect x="20" y="40" width="160" height="240" rx="15" fill="url(#bodyGrad)" stroke="#2c3e50" stroke-width="2"/>

    <!-- Stripe -->
    <rect x="20" y="240" width="160" height="20" fill="#f1c40f" opacity="0.9"/>

    <!-- Label Background -->
    <circle cx="100" cy="140" r="45" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>

    <!-- Lightning Icon -->
    <path d="M90 110 L115 110 L105 135 L125 135 L90 170 L100 145 L80 145 Z" fill="#f39c12" stroke="#e67e22" stroke-width="1" stroke-linejoin="round"/>

    <!-- Plus Sign -->
    <path d="M90 70 H110 M100 60 V80" stroke="#ecf0f1" stroke-width="5" stroke-linecap="round"/>

    <!-- Glossy Highlight -->
    <rect x="35" y="50" width="15" height="220" rx="7" fill="url(#highlight)"/>
  </g>
</svg>