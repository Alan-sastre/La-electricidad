<svg width="256" height="300" viewBox="0 0 256 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#90a4ae"/>
      <stop offset="100%" stop-color="#607d8b"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <radialGradient id="motorGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#546e7a"/>
      <stop offset="100%" stop-color="#37474f"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base -->
    <ellipse cx="128" cy="270" rx="60" ry="20" fill="url(#baseGrad)"/>
    <rect x="108" y="250" width="40" height="20" fill="#78909c"/>
    
    <!-- Buttons -->
    <circle cx="115" cy="275" r="4" fill="#ef5350"/>
    <circle cx="128" cy="275" r="4" fill="#bdbdbd"/>
    <circle cx="141" cy="275" r="4" fill="#bdbdbd"/>

    <!-- Neck -->
    <rect x="118" y="150" width="20" height="110" fill="url(#neckGrad)"/>
    
    <!-- Motor Housing (Back) -->
    <circle cx="128" cy="130" r="40" fill="url(#motorGrad)"/>
    
    <!-- Rear Cage (Wireframe) -->
    <circle cx="128" cy="130" r="90" fill="none" stroke="#b0bec5" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="128" cy="130" r="70" fill="none" stroke="#b0bec5" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M128 40 L128 220" stroke="#b0bec5" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M38 130 L218 130" stroke="#b0bec5" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M64 66 L192 194" stroke="#b0bec5" stroke-width="1" stroke-opacity="0.5"/>
    <path d="M64 194 L192 66" stroke="#b0bec5" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>