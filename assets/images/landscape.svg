<svg width="800" height="400" preserveAspectRatio="none" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Back Hills -->
  <path d="M0,250 Q200,150 400,250 T800,250 V400 H0 Z" fill="url(#hillBack)" />
  
  <!-- Front Hills -->
  <path d="M0,400 V300 Q200,200 400,350 T800,300 V400 H0 Z" fill="url(#hillFront)" />
  
  <!-- Trees (Simple shapes) -->
  <g transform="translate(100, 280)">
    <circle cx="0" cy="0" r="20" fill="#2E7D32" />
    <circle cx="15" cy="-10" r="25" fill="#2E7D32" />
    <circle cx="30" cy="0" r="20" fill="#2E7D32" />
    <rect x="10" y="0" width="10" height="40" fill="#3E2723" />
  </g>
  
  <g transform="translate(600, 260) scale(0.8)">
    <circle cx="0" cy="0" r="20" fill="#388E3C" />
    <circle cx="15" cy="-10" r="25" fill="#388E3C" />
    <circle cx="30" cy="0" r="20" fill="#388E3C" />
    <rect x="10" y="0" width="10" height="40" fill="#4E342E" />
  </g>
</svg>